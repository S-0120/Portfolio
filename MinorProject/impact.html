<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YWASTE - Impact Corner</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body {
        background-color: #FDF3DC; /* Cream pastel base */
        overflow-x: hidden;
    }

    /* ---------- NAVBAR / HEADER ---------- */
    .impact-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 30px 50px;
        font-size: 1.8rem;
        font-weight: 600;
        color: #333;
    }
    .impact-logo img {
        width: 35px;
    }

    .home-btn {
        position: absolute;
        right: 50px;
        top: 40px;
        padding: 10px 25px;
        border-radius: 30px;
        font-weight: 600;
        border: none;
        background: linear-gradient(90deg, #7F52FF, #F2C94C);
        color: white;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    }
    .home-btn:hover { opacity: 0.85; }

    /* ---------- GRID LAYOUT ---------- */
    .impact-container {
        margin: 40px 50px;
        display: grid;
        grid-template-columns: 1.4fr 1fr 1fr 1.2fr;
        grid-template-rows: 250px 250px;
        gap: 25px;
    }

    /* ---------- PICTURE CAROUSEL ---------- */
    .carousel-box {
        background: #D5E9FF;
        border-radius: 20px;
        overflow: hidden;
        position: relative;
        grid-row: span 2;
    }
    .carousel-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        opacity: 0;
        transition: opacity 1s ease;
    }
    .carousel-box img.active { opacity: 1; }

    /* ---------- CARDS SHARED STYLE ---------- */
    .card {
    border-radius: 20px;
    position: relative;
    padding: 30px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    font-weight: 600;
    color: white;
    font-size: 1.4rem;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: pointer;
}

.card:hover {
    transform: translateY(-6px) scale(1.05);
    box-shadow: 0 12px 28px rgba(0,0,0,0.18);
}

.plus {
    transition: background 0.3s ease;
}


    /* CARD COLORS */
    .purple { background: #C7A6DC; }
    .mustard { background: #C59E3B; }
    .orange { background: #F2782A; }
    .blue { background: #D8E9FF; color: #7A649E; font-weight: 700; }

    /* ---------- GRAPH BOX ---------- */
    .graph-box {
        background: #54c0e4;
        border-radius: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 2rem;
        font-weight: 600;
        grid-row: span 2;
    }
    #impactGraph {
    width: 100%;
    height: 100%;
}

/* NAVBAR */
.navbar {
    background: #ffffff;
    padding: 14px 45px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 3px 8px rgba(0,0,0,0.06);
    position: sticky;
    top: 0;
    z-index: 999;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.3rem;
    font-weight: 700;
    color: #5A4AE3; /* purple from your theme */
}

.brand img {
    width: 34px;
}

/* NEW HOME BUTTON */
.home-btn {
    background: transparent;
    border: 2px solid #F2C94C;
    padding: 8px 18px;
    border-radius: 18px;
    font-size: 0.9rem;
    color: #5A4AE3;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s ease;
}

.home-btn:hover {
    background: linear-gradient(90deg, #7F52FF, #F2C94C);
    color: white;
    border-color: transparent;
    box-shadow: 0 4px 10px rgba(127,82,255,0.3);
}

/* SECTION TITLE (reduced height) */
.section-header {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;   /* smaller than before */
    text-align: center;
    margin: 30px auto 10px; /* reduced top margin */
    font-weight: 700;
    color: #5A4AE3;
    letter-spacing: 2px;
}

.section-header::after {
    content: "";
    width: 70px; /* smaller underline */
    height: 3px;
    background: linear-gradient(90deg, #7F52FF, #F2C94C);
    display: block;
    margin: 8px auto 0;
    border-radius: 2px;
}


</style>
</head>

<body>

<!-- ---------- HEADER ---------- -->
<div class="navbar">

    <h1 class="section-header">IMPACT INSIGHTS</h1>

</div>


<button class="home-btn" onclick="window.location.href='file.html'">home</button>

<!-- ---------- MAIN GRID ---------- -->
<div class="impact-container">

    <!-- LEFT PICTURE CAROUSEL -->
    <div class="carousel-box">
        <img src="images/impact1.jpg" class="active">

    <!-- CARDS ROW -->

<!-- ---------- CAROUSEL SCRIPT ---------- -->
<script>
    const imageFolder = "carousel/";
    const imageFiles = ["img1.jpg", "img2.jpg", "img3.webp", "img4.avif"]; 
    // <<--- just rename files here when you add/remove

    const carouselBox = document.querySelector(".carousel-box");
    let index = 0;
    const images = [];

    // Create and append images dynamically
    imageFiles.forEach((file, i) => {
        const img = document.createElement("img");
        img.src = imageFolder + file;
        if (i === 0) img.classList.add("active");
        carouselBox.appendChild(img);
        images.push(img);
    });

    setInterval(() => {
        images[index].classList.remove("active");
        index = (index + 1) % images.length;
        images[index].classList.add("active");
    }, 2500);
</script>

<script>
function animateMetrics() {
    const cards = document.querySelectorAll(".card");
    
    cards.forEach(card => {
        const metric = card.querySelector(".metric");
        const target = parseFloat(card.dataset.target);
        const unit = card.dataset.unit || "";
        let current = 0;
        const increment = target / 100; // speed

        const counter = setInterval(() => {
            current += increment;
            if (current >= target) {
                current = target;
                clearInterval(counter);
            }
            metric.textContent = unit === " Tons" ? current.toFixed(1) + unit : Math.floor(current) + unit;
        }, 20); // update every 20ms
    });
}

// Trigger animation on load
window.onload = animateMetrics;
</script>

<script>
const canvas = document.getElementById("impactGraph");
const ctx = canvas.getContext("2d");

function drawLineGraph() {
    const data = [10, 25, 18, 32, 40, 28];
    const labels = ["Jan", "Feb", "Mar", "Apr", "May", "Jun"];

    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.beginPath();
    ctx.lineWidth = 4;
    ctx.strokeStyle = "#7F52FF";
    ctx.lineJoin = "round";
    ctx.lineCap = "round";

    const gap = canvas.width / (data.length - 1);
    const max = Math.max(...data);
    const scale = (canvas.height - 40) / max;

    data.forEach((value, i) => {
        const x = i * gap;
        const y = canvas.height - value * scale;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });

    ctx.stroke();

    // dots
    data.forEach((value, i) => {
        const x = i * gap;
        const y = canvas.height - value * scale;
        ctx.fillStyle = "#F2C94C";
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.fillText(labels[i], x - 10, canvas.height - 8);
    });
}

window.onload = () => {
    animateMetrics();
    drawLineGraph();
};



</script>



</body>
